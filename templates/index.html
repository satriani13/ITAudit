{% extends "base.html" %}
{% block title %}Auditorías IT{% endblock %}

{% block nav %}
  <button class="btn btn-primary" id="new-audit-btn" data-i18n="action.new_audit">+ Nueva auditoría</button>
{% endblock %}

{% block content %}
<section class="stack">
  <div class="page-head">
    <div>
      <h1 data-i18n="dash.heading">Auditorías</h1>
      <p class="muted" data-i18n="dash.subtitle">Seguimiento de auditorías IT para nuevas fábricas y oficinas.</p>
    </div>
  </div>

  <div class="filters">
    <input type="search" id="search" data-i18n-ph="filter.search_audits" autocomplete="off">
    <select id="status-filter">
      <option value="" data-i18n="filter.all_status">Todos los estados</option>
      <option value="en_progreso" data-i18n="status.en_progreso">En progreso</option>
      <option value="completada" data-i18n="status.completada">Completada</option>
      <option value="archivada" data-i18n="status.archivada">Archivada</option>
    </select>
  </div>

  <div id="audit-grid" class="audit-grid"></div>
  <div id="empty" class="empty" hidden>
    <p data-i18n="empty.none">Aún no hay auditorías.</p>
    <button class="btn btn-primary" id="empty-new-btn" data-i18n="empty.create_first">Crear la primera</button>
  </div>
</section>

<dialog id="audit-dialog" class="dialog">
  <form method="dialog" id="audit-form">
    <h2 id="dialog-title" data-i18n="dialog.new_title">Nueva auditoría</h2>
    <input type="hidden" name="id">
    <label><span data-i18n="field.name">Nombre</span> *
      <input name="name" required maxlength="200" placeholder="Fábrica Valencia — puesta en marcha">
    </label>
    <div class="grid-2">
      <label><span data-i18n="field.kind">Tipo</span>
        <select name="kind">
          <option value="fabrica" data-i18n="kind.fabrica">Fábrica</option>
          <option value="oficina" data-i18n="kind.oficina">Oficina</option>
          <option value="cpd" data-i18n="kind.cpd">CPD</option>
          <option value="otro" data-i18n="kind.otro">Otro</option>
        </select>
      </label>
      <label><span data-i18n="field.status">Estado</span>
        <select name="status">
          <option value="en_progreso" data-i18n="status.en_progreso">En progreso</option>
          <option value="completada" data-i18n="status.completada">Completada</option>
          <option value="archivada" data-i18n="status.archivada">Archivada</option>
        </select>
      </label>
    </div>
    <div class="grid-2">
      <label><span data-i18n="field.client">Cliente / empresa</span>
        <input name="client" maxlength="200">
      </label>
      <label><span data-i18n="field.location">Ubicación</span>
        <input name="location" maxlength="200">
      </label>
    </div>
    <div class="grid-2">
      <label><span data-i18n="field.auditor">Auditor</span>
        <input name="auditor" maxlength="200">
      </label>
      <label><span data-i18n="field.start_date">Fecha de inicio</span>
        <input name="start_date" type="date">
      </label>
    </div>
    <label><span data-i18n="field.notes">Notas</span>
      <textarea name="notes" rows="3"></textarea>
    </label>
    <label class="check" id="blank-wrap">
      <input type="checkbox" name="blank"> <span data-i18n="dialog.blank">Crear vacía (sin plantilla de secciones)</span>
    </label>
    <div class="dialog-actions">
      <button type="button" class="btn" data-close data-i18n="action.cancel">Cancelar</button>
      <button type="submit" class="btn btn-primary" data-i18n="action.save">Guardar</button>
    </div>
  </form>
</dialog>

<template id="card-tpl">
  <a class="card audit-card">
    <div class="card-top">
      <span class="chip chip-kind" data-kind></span>
      <span class="chip chip-status" data-status></span>
    </div>
    <h3 data-name></h3>
    <p class="muted" data-sub></p>
    <div class="progress"><div class="progress-bar" data-bar></div></div>
    <div class="card-foot">
      <span data-progress-text></span>
      <span class="issues" data-issues></span>
    </div>
  </a>
</template>
{% endblock %}

{% block scripts %}
<script src="static/js/dashboard.js"></script>
{% endblock %}
