<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base href="{{ base }}/">
  <title>{% block title %}Auditoría IT{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="static/css/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="">
      <span class="brand-mark">IT</span>
      <span class="brand-text" data-i18n="app.title">Auditoría IT</span>
    </a>
    <div class="topbar-right">
      <nav class="topbar-nav">{% block nav %}{% endblock %}</nav>
      <select id="lang-select" class="lang-select" aria-label="Idioma / Language / Lingua">
        <option value="es">ES</option>
        <option value="en">EN</option>
        <option value="it">IT</option>
      </select>
    </div>
  </header>
  <main class="page">{% block content %}{% endblock %}</main>
  <div id="toast" class="toast" hidden></div>

  <script src="static/js/i18n.js"></script>
  <script>
    (function () {
      var sel = document.getElementById("lang-select");
      var lang = window.I18N.currentLang();
      document.documentElement.lang = lang;
      sel.value = lang;
      window.I18N.apply(document);
      sel.addEventListener("change", function () {
        window.I18N.setLang(sel.value);
        location.reload();
      });
    })();
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
